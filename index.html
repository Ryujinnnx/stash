<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080810" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stash</title>
    <style>
      :root { color-scheme: dark; --bg:#080810; --t1:#f0f0ff; --t2:rgba(240,240,255,.62); --t3:rgba(240,240,255,.34); --accent:#6366f1; --border:rgba(255,255,255,.08); }
      body { margin:0; background:var(--bg); color:var(--t1); font-family:"DM Sans",Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
      .boot-shell { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 28%, rgba(99,102,241,.12), transparent 34%), var(--bg); }
      .boot-inner { width:min(920px,100%); }
      .boot-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:72px; color:var(--t3); font:500 12px/1 "DM Mono",monospace; text-transform:uppercase; letter-spacing:.08em; }
      .boot-brand { display:flex; align-items:center; gap:10px; color:var(--t1); font:600 15px/1 "Instrument Sans",Inter,sans-serif; text-transform:none; letter-spacing:0; }
      .boot-logo { width:22px; height:22px; display:grid; grid-template-columns:repeat(2,1fr); gap:3px; }
      .boot-logo span { background:var(--accent); border-radius:5px; box-shadow:0 0 20px rgba(99,102,241,.3); }
      .boot-card { border:1px solid var(--border); border-radius:28px; padding:48px; background:linear-gradient(155deg,rgba(13,13,26,.96),rgba(18,18,36,.72)); box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 24px 80px rgba(0,0,0,.45); }
      .boot-eyebrow { margin:0 0 18px; color:var(--accent); font:500 10px/16px "DM Mono",monospace; text-transform:uppercase; letter-spacing:.12em; }
      .boot-title { margin:0; max-width:11ch; color:var(--t1); font:500 clamp(52px,8vw,94px)/.94 "Instrument Sans",Inter,sans-serif; letter-spacing:-.055em; }
      .boot-title span { color:var(--accent); }
      .boot-copy { max-width:48ch; margin:24px 0 0; color:var(--t2); font:300 17px/1.7 "DM Sans",Inter,sans-serif; }
      .boot-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:36px; }
      .boot-actions a { display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 20px; border-radius:999px; text-decoration:none; font:500 14px/1 "DM Sans",Inter,sans-serif; }
      .boot-primary { background:var(--accent); color:white; box-shadow:0 8px 32px rgba(99,102,241,.2); }
      .boot-secondary { border:1px solid var(--border); color:var(--t1); background:rgba(255,255,255,.02); }
      .boot-status { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; color:var(--t3); font:400 11px/1.5 "DM Mono",monospace; }
      .boot-status span { border:1px solid var(--border); border-radius:999px; padding:6px 9px; background:rgba(255,255,255,.02); }
      @media (max-width:640px) { .boot-card { padding:30px; border-radius:22px; } .boot-nav { margin-bottom:36px; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="Stash loading shell">
        <section class="boot-inner">
          <div class="boot-nav">
            <div class="boot-brand"><span class="boot-logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span>Stash</div>
            <span>Shelbinet</span>
          </div>
          <div class="boot-card">
            <p class="boot-eyebrow">Decentralized dataset marketplace</p>
            <h1 class="boot-title">Your data. <span>Finally yours.</span></h1>
            <p class="boot-copy">Stash lists datasets on Aptos Shelbinet, stores encrypted artifacts on Shelby, and keeps access control on-chain.</p>
            <div class="boot-actions">
              <a class="boot-primary" href="/upload">Start selling</a>
              <a class="boot-secondary" href="/marketplace">Browse datasets</a>
            </div>
            <div class="boot-status" aria-label="Network status">
              <span>Move package live</span>
              <span>Shelby storage wired</span>
              <span>Petra wallet supported</span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
